[project]
name = "taid"
version = "0.1.0"
description = "Temporally Adaptive Interpolated Distillation for language models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "absl-py==2.1.0",
    "accelerate==0.28.0",
    "datasets==2.18.0",
    "evaluate==0.4.1",
    "lightning==2.2.3",
    "litdata==0.2.15",
    "natsort==8.4.0",
    "nltk==3.8.1",
    "numerize==0.12",
    "numpy==1.26.4",
    "protobuf==3.20.3",
    "rich==13.7.1",
    "rouge-score==0.1.2",
    "sentencepiece==0.2.0",
    "torchtyping==0.1.4",
    "transformers==4.41.2",
    "wandb==0.16.6",
]

[project.optional-dependencies]
cpu = [
    "torch==2.9.1",
]
cuda = [
    "torch==2.9.1; sys_platform == 'linux' or sys_platform == 'win32'",
]
rocm = [
    "torch==2.9.1; sys_platform == 'linux'",
    "pytorch-triton-rocm; sys_platform == 'linux'",
]
xpu = [
    "torch==2.9.1; sys_platform == 'linux' or sys_platform == 'win32'",
    "pytorch-triton-xpu; sys_platform == 'linux' or sys_platform == 'win32'",
]
deepspeed = [
    "deepspeed>=0.16,<0.19; sys_platform == 'linux'",
]

[tool.uv]
package = false
required-version = ">=0.10.0"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "rocm" },
        { extra = "xpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm64", extra = "rocm", marker = "sys_platform == 'linux'" },
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm64", extra = "rocm", marker = "sys_platform == 'linux'" },
]
pytorch-triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm64"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.pip]
torch-backend = "auto"
